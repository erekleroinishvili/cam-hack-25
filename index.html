<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Pixel Permuter — Same Pixels, Different Truth</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; }
    .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 16px; flex: 1; min-width: 280px; }
    .card h3 { margin-top: 0; }
    .preview { width: 100%; max-height: 360px; object-fit: contain; background: #f6f6f6; border-radius: 8px; }
    .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
    button { padding: 10px 16px; border-radius: 10px; border: none; background: black; color: white; cursor: pointer; }
    button:disabled { background: #666; cursor: default; }
    .hint { color: #666; font-size: 0.9em; }

    input[type=range] { /* slider style */
      width: 120px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <h1>Pixel Permuter</h1>
  <p class="hint">Upload a <b>source</b> image (pixels we must reuse) and a <b>target</b> image (look-alike). The output uses exactly the source pixels, just rearranged.</p>

  <div class="row">
    <div class="card">
      <h3>Source image</h3>
      <input id="src" type="file" accept="image/*" />
      <img id="srcPreview" class="preview" />
    </div>
    <div class="card">
      <h3>Target image</h3>
      <input id="tgt" type="file" accept="image/*" />
      <img id="tgtPreview" class="preview" />
    </div>
    <div class="card">
      <h3>Output (permuted)</h3>
      <img id="outPreview" class="preview" />
      <div id="status" class="hint"></div>
    </div>
  </div>

  <div class="controls">
    <label>Max side:
      <input id="maxSide" type="number" min="64" max="1024" value="256" />
    </label>
    <label>XY weight:
      <input id="xyWeight" type="number" step="0.05" min="0" max="2" value="0.25" />
    </label>
    <button id="goBtn" disabled>Transform</button>
    <label>Duration (sec):
        <input id="durationSec" type="range" min="1" max="10" step="0.5" value="2" />
        <span id="durationValue">2.0</span>s
    </label>
    <button id="animBtn" disabled>Animate</button>
    <button id="exportKeyBtn" disabled>Export Transform Key</button>
    <button id="exportOutputBtn" disabled>Export Output Image</button>
  </div>

  <div class="controls">
    <label>Import Transform Key:
      <input id="keyFile" type="file" accept=".json" />
    </label>
    <label>Import Transformed Image:
      <input id="transformedImageFile" type="file" accept="image/*" />
    </label>
    <button id="reverseBtn" disabled>Reverse Animation</button>
  </div>

  <canvas id="animCanvas" style="max-width: 100%; border:1px solid #ddd; border-radius:8px;"></canvas>
  <div id="animStatus" class="hint"></div>

  <script>
    const srcInput = document.getElementById('src');
    const tgtInput = document.getElementById('tgt');
    const srcPreview = document.getElementById('srcPreview');
    const tgtPreview = document.getElementById('tgtPreview');
    const outPreview = document.getElementById('outPreview');
    const goBtn = document.getElementById('goBtn');
    const statusEl = document.getElementById('status');

    function readPreview(input, imgEl) {
      const f = input.files && input.files[0];
      if (!f) { imgEl.src = ''; return; }
      const url = URL.createObjectURL(f);
      imgEl.src = url;
    }

    function canGo() {
      goBtn.disabled = !(srcInput.files.length && tgtInput.files.length);
    }

    srcInput.addEventListener('change', () => { readPreview(srcInput, srcPreview); canGo(); });
    tgtInput.addEventListener('change', () => { readPreview(tgtInput, tgtPreview); canGo(); });

    document.getElementById('goBtn').addEventListener('click', async () => {
      if (!srcInput.files[0] || !tgtInput.files[0]) return;
      statusEl.textContent = 'Transforming…';
      goBtn.disabled = true;
      outPreview.src = '';

      const fd = new FormData();
      fd.append('src', srcInput.files[0]);
      fd.append('tgt', tgtInput.files[0]);
      fd.append('max_side', document.getElementById('maxSide').value);
      fd.append('xy_weight', document.getElementById('xyWeight').value);

      try {
        const resp = await fetch('/transform', { method: 'POST', body: fd });

        if (!resp.ok) {
          const msg = await resp.text();
          statusEl.textContent = `Error: ${msg}`;
        } else {
          const blob = await resp.blob();
          const url = URL.createObjectURL(blob);
          outPreview.src = url;
          statusEl.textContent = 'Done.';
        }
      } catch (e) {
        statusEl.textContent = 'Request failed. Is the Python server running on 127.0.0.1:5000?';
      } finally {
        goBtn.disabled = false;
      }
    });
  </script>

  <script>
    const durationSlider = document.getElementById('durationSec');
    const durationValue = document.getElementById('durationValue');

    // Show the numeric value beside the slider
    durationSlider.addEventListener('input', () => {
    durationValue.textContent = durationSlider.value;
    });

    const animBtn = document.getElementById('animBtn');
    const animCanvas = document.getElementById('animCanvas');
    const animStatus = document.getElementById('animStatus');
    const exportKeyBtn = document.getElementById('exportKeyBtn');
    const exportOutputBtn = document.getElementById('exportOutputBtn');
    const reverseBtn = document.getElementById('reverseBtn');
    const keyFileInput = document.getElementById('keyFile');
    const transformedImageFileInput = document.getElementById('transformedImageFile');

    let lastUploadSrcBlob = null;
    let lastUploadTgtBlob = null;
    let lastTransformKey = null; // Store the transformation key
    let lastTransformedImageBlob = null; // Store imported transformed image

    // Track selected files so we can reuse for animation
    srcInput.addEventListener('change', () => { lastUploadSrcBlob = srcInput.files[0] || null; });
    tgtInput.addEventListener('change', () => { lastUploadTgtBlob = tgtInput.files[0] || null; });

    // Enable Animate when both files present
    function updateAnimEnabled() {
        animBtn.disabled = !(lastUploadSrcBlob && lastUploadTgtBlob);
        exportKeyBtn.disabled = !lastTransformKey;
        exportOutputBtn.disabled = !outPreview.src;
        reverseBtn.disabled = !(lastTransformKey && lastTransformedImageBlob);
    }
    srcInput.addEventListener('change', updateAnimEnabled);
    tgtInput.addEventListener('change', updateAnimEnabled);

    animBtn.addEventListener('click', async () => {
        if (!lastUploadSrcBlob || !lastUploadTgtBlob) return;
        animStatus.textContent = 'Preparing animation…';
        animBtn.disabled = true;

        // 1) Ask backend for permutation map (same params as transform)
        const fd = new FormData();
        fd.append('src', lastUploadSrcBlob);
        fd.append('tgt', lastUploadTgtBlob);
        fd.append('max_side', document.getElementById('maxSide').value);
        fd.append('xy_weight', document.getElementById('xyWeight').value);

        let perm, W, H;
        try {
        const resp = await fetch('/perm_map', { method: 'POST', body: fd });
        if (!resp.ok) throw new Error('perm_map failed');
        const js = await resp.json();
        W = js.width; H = js.height; perm = js.perm;

        // Store the transformation key
        lastTransformKey = {
            perm: perm,
            width: W,
            height: H,
            swirlStrength: 4.0 * Math.PI, // Must match the animation code
            centerX: W / 2,
            centerY: H / 2,
            maxSide: parseInt(document.getElementById('maxSide').value),
            xyWeight: parseFloat(document.getElementById('xyWeight').value),
            timestamp: new Date().toISOString()
        };
        updateAnimEnabled();
        } catch (e) {
        animStatus.textContent = 'Failed to get permutation map.';
        animBtn.disabled = false;
        return;
        }

        // 2) Load the source image pixels at (W,H)
        const srcBitmap = await createImageBitmap(lastUploadSrcBlob);
        // Draw into an offscreen canvas to read pixels
        const srcCan = new OffscreenCanvas(W, H);
        const srcCtx = srcCan.getContext('2d', { willReadFrequently: true });
        // Fit source to (W,H) just like backend does
        srcCtx.drawImage(srcBitmap, 0, 0, W, H);
        const srcImg = srcCtx.getImageData(0, 0, W, H);
        const srcData = srcImg.data; // Uint8ClampedArray RGBA, length 4*N

        // 3) Prepare animation canvas
        animCanvas.width = W;
        animCanvas.height = H;
        const ctx = animCanvas.getContext('2d', { willReadFrequently: true });

        // Precompute positions for speed
        const N = W * H;
        const x0 = new Float32Array(N);
        const y0 = new Float32Array(N);
        const x1 = new Float32Array(N);
        const y1 = new Float32Array(N);

        // source index -> (x0,y0)
        for (let s = 0; s < N; s++) {
        x0[s] = s % W;
        y0[s] = (s / W) | 0;
        }
        // target index -> (x1,y1), and we already have perm[target] = source
        for (let t = 0; t < N; t++) {
        x1[t] = t % W;
        y1[t] = (t / W) | 0;
        }

        const durationSec = parseFloat(document.getElementById('durationSec').value);
        const durationMs = durationSec * 1000; // previously had 2000ms default
        const fps = 30;
        const frameMs = 1000 / fps;
        let start = performance.now();

        // We’ll write directly into an ImageData each frame
        const frameImg = ctx.createImageData(W, H);
        const frameData = frameImg.data;

        function drawFrame(now) {
        let t = (now - start) / durationMs;
        if (t > 1) t = 1;

        // Easing function for smoother animation
        const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

        // Swirl parameters - these define the spiral motion
        // The key insight: these parameters are DETERMINISTIC and REVERSIBLE
        // To undo the animation, use the same params with t reversed and src/tgt swapped
        const centerX = W / 2;
        const centerY = H / 2;
        const maxDist = Math.sqrt(centerX * centerX + centerY * centerY);

        // Swirl strength: how many radians to rotate based on distance from center
        const swirlStrength = 4.0 * Math.PI; // 2 full rotations

        // Clear frame
        frameData.fill(0);

        for (let j = 0; j < N; j++) {
            const i = perm[j];

            const sx = x0[i], sy = y0[i];
            const tx = x1[j], ty = y1[j];

            // Linear interpolation
            const lerpX = sx * (1 - eased) + tx * eased;
            const lerpY = sy * (1 - eased) + ty * eased;

            // Calculate swirl effect based on distance from center
            const dx = lerpX - centerX;
            const dy = lerpY - centerY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const normalizedDist = Math.min(dist / maxDist, 1.0);

            // Rotation angle: more rotation when t is in the middle (0.5)
            // and based on distance from center
            const tProgress = 1 - eased; // Inverse so it unswirls as it drops
            const rotationAngle = swirlStrength * normalizedDist * tProgress * Math.sin(Math.PI * eased);

            // Apply rotation around center
            const cosA = Math.cos(rotationAngle);
            const sinA = Math.sin(rotationAngle);
            const rotX = dx * cosA - dy * sinA;
            const rotY = dx * sinA + dy * cosA;

            // Final position with swirl applied
            const xi = Math.round(centerX + rotX);
            const yi = Math.round(centerY + rotY);

            if (xi < 0 || xi >= W || yi < 0 || yi >= H) continue;

            const srcOfs = i * 4;
            const r = srcData[srcOfs + 0];
            const g = srcData[srcOfs + 1];
            const b = srcData[srcOfs + 2];
            const a = 255;

            // Write a 2x2 splat to reduce holes during swirl
            for (let dy = 0; dy <= 1; dy++) {
                for (let dx = 0; dx <= 1; dx++) {
                    const xj = xi + dx, yj = yi + dy;
                    if (xj >= 0 && xj < W && yj >= 0 && yj < H) {
                        const o = (yj * W + xj) * 4;
                        frameData[o+0] = r;
                        frameData[o+1] = g;
                        frameData[o+2] = b;
                        frameData[o+3] = a;
                    }
                }
            }
        }

        ctx.putImageData(frameImg, 0, 0);

        if (t < 1) {
            setTimeout(() => requestAnimationFrame(drawFrame), frameMs);
        } else {
            animStatus.textContent = 'Animation complete.';
            animBtn.disabled = false;
            updateAnimEnabled();
        }
        }

        animStatus.textContent = 'Animating…';
        requestAnimationFrame(drawFrame);
    });

    // Export transformation key
    exportKeyBtn.addEventListener('click', () => {
        if (!lastTransformKey) return;

        const keyJson = JSON.stringify(lastTransformKey, null, 2);
        const blob = new Blob([keyJson], { type: 'application/json' });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = `transform-key-${Date.now()}.json`;
        a.click();

        URL.revokeObjectURL(url);
        animStatus.textContent = 'Transform key exported!';
    });

    // Export output image
    exportOutputBtn.addEventListener('click', async () => {
        if (!outPreview.src) return;

        try {
            const response = await fetch(outPreview.src);
            const blob = await response.blob();
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = `transformed-output-${Date.now()}.png`;
            a.click();

            URL.revokeObjectURL(url);
            animStatus.textContent = 'Output image exported!';
        } catch (e) {
            animStatus.textContent = 'Failed to export output image.';
        }
    });

    // Import transformation key
    keyFileInput.addEventListener('change', async () => {
        const file = keyFileInput.files[0];
        if (!file) return;

        try {
            const text = await file.text();
            const key = JSON.parse(text);

            // Validate the key has required fields
            if (!key.perm || !key.width || !key.height) {
                throw new Error('Invalid key file');
            }

            lastTransformKey = key;
            updateAnimEnabled();
            animStatus.textContent = `Transform key loaded: ${key.width}x${key.height}`;
        } catch (e) {
            animStatus.textContent = 'Failed to load transform key: ' + e.message;
        }
    });

    // Import transformed image for reversing
    transformedImageFileInput.addEventListener('change', () => {
        const file = transformedImageFileInput.files[0];
        if (!file) {
            lastTransformedImageBlob = null;
            updateAnimEnabled();
            return;
        }

        lastTransformedImageBlob = file;
        updateAnimEnabled();
        animStatus.textContent = `Transformed image loaded: ${file.name}`;
    });

    // Reverse animation - apply inverse transformation
    reverseBtn.addEventListener('click', async () => {
        if (!lastTransformKey || !lastTransformedImageBlob) {
            animStatus.textContent = 'Need both a transform key and transformed image!';
            return;
        }

        animStatus.textContent = 'Preparing reverse animation…';
        reverseBtn.disabled = true;

        const key = lastTransformKey;
        const W = key.width;
        const H = key.height;

        // Load the transformed image from the imported file
        const srcBitmap = await createImageBitmap(lastTransformedImageBlob);

        // Get pixel data from transformed image
        const srcCan = new OffscreenCanvas(W, H);
        const srcCtx = srcCan.getContext('2d', { willReadFrequently: true });
        srcCtx.drawImage(srcBitmap, 0, 0, W, H);
        const srcImg = srcCtx.getImageData(0, 0, W, H);
        const srcData = srcImg.data;

        // Prepare animation canvas
        animCanvas.width = W;
        animCanvas.height = H;
        const ctx = animCanvas.getContext('2d', { willReadFrequently: true });

        // Build INVERSE permutation: if perm[t] = s, then invPerm[s] = t
        const N = W * H;
        const invPerm = new Int32Array(N);
        for (let t = 0; t < N; t++) {
            invPerm[key.perm[t]] = t;
        }

        // Precompute positions
        const x0 = new Float32Array(N);
        const y0 = new Float32Array(N);
        const x1 = new Float32Array(N);
        const y1 = new Float32Array(N);

        // Now source is the output image (current state), target is original positions
        for (let s = 0; s < N; s++) {
            x0[s] = s % W;
            y0[s] = (s / W) | 0;
        }
        for (let t = 0; t < N; t++) {
            x1[t] = t % W;
            y1[t] = (t / W) | 0;
        }

        const durationSec = parseFloat(document.getElementById('durationSec').value);
        const durationMs = durationSec * 1000;
        const fps = 30;
        const frameMs = 1000 / fps;
        let start = performance.now();

        const frameImg = ctx.createImageData(W, H);
        const frameData = frameImg.data;

        function drawFrame(now) {
            let t = (now - start) / durationMs;
            if (t > 1) t = 1;

            const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

            const centerX = key.centerX;
            const centerY = key.centerY;
            const maxDist = Math.sqrt(centerX * centerX + centerY * centerY);
            const swirlStrength = key.swirlStrength;

            frameData.fill(0);

            for (let j = 0; j < N; j++) {
                const i = invPerm[j];

                const sx = x0[i], sy = y0[i];
                const tx = x1[j], ty = y1[j];

                const lerpX = sx * (1 - eased) + tx * eased;
                const lerpY = sy * (1 - eased) + ty * eased;

                const dx = lerpX - centerX;
                const dy = lerpY - centerY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const normalizedDist = Math.min(dist / maxDist, 1.0);

                const tProgress = 1 - eased;
                const rotationAngle = swirlStrength * normalizedDist * tProgress * Math.sin(Math.PI * eased);

                const cosA = Math.cos(rotationAngle);
                const sinA = Math.sin(rotationAngle);
                const rotX = dx * cosA - dy * sinA;
                const rotY = dx * sinA + dy * cosA;

                const xi = Math.round(centerX + rotX);
                const yi = Math.round(centerY + rotY);

                if (xi < 0 || xi >= W || yi < 0 || yi >= H) continue;

                const srcOfs = i * 4;
                const r = srcData[srcOfs + 0];
                const g = srcData[srcOfs + 1];
                const b = srcData[srcOfs + 2];
                const a = 255;

                for (let dy = 0; dy <= 1; dy++) {
                    for (let dx = 0; dx <= 1; dx++) {
                        const xj = xi + dx, yj = yi + dy;
                        if (xj >= 0 && xj < W && yj >= 0 && yj < H) {
                            const o = (yj * W + xj) * 4;
                            frameData[o+0] = r;
                            frameData[o+1] = g;
                            frameData[o+2] = b;
                            frameData[o+3] = a;
                        }
                    }
                }
            }

            ctx.putImageData(frameImg, 0, 0);

            if (t < 1) {
                setTimeout(() => requestAnimationFrame(drawFrame), frameMs);
            } else {
                animStatus.textContent = 'Reverse animation complete - original image recovered!';
                reverseBtn.disabled = false;
            }
        }

        animStatus.textContent = 'Reversing animation…';
        requestAnimationFrame(drawFrame);
    });
  </script>

</body>
</html>
